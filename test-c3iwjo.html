<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Form Wizard - Step 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #f8fafc;
        --bg-card: #ffffff;
        --bg-icon: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border-light: #e2e8f0;
        --border-radio: #cbd5e1;
        --progress-track: #e2e8f0;
        --progress-fill: #0f172a;
        --radius-sm: 12px;
        --radius-md: 16px;
        --radius-full: 9999px;
        --font-family: "Public Sans", system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--font-family);
        background: var(--bg-page);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      .wizard {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg-page);
        display: flex;
        flex-direction: column;
      }

      .wizard-inner {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        overflow: hidden;
      }

      .wizard-content {
        padding: 40px 160px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      /* Progress section */
      .progress-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 32px 0;
        width: 100%;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
      }

      .progress-labels {
        display: flex;
        flex-direction: column;
      }

      .step-indicator {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 20px;
        letter-spacing: 0.7px;
        height: 20px;
        display: flex;
        align-items: center;
      }

      .step-title {
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
        height: 24px;
        display: flex;
        align-items: center;
      }

      .progress-percent {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 21px;
        height: 21px;
        display: flex;
        align-items: center;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--progress-track);
        border-radius: var(--radius-full);
        position: relative;
        overflow: hidden;
      }

      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 192px;
        background: var(--progress-fill);
        border-radius: var(--radius-full);
      }

      /* Main content */
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 24px 0;
        width: 100%;
      }

      .heading {
        padding-bottom: 12px;
      }

      .heading h1 {
        margin: 0;
        color: var(--text-primary);
        font-size: 36px;
        font-weight: 700;
        line-height: 45px;
        letter-spacing: -0.9px;
      }

      .subtitle {
        max-width: 672px;
        color: var(--text-secondary);
        font-size: 18px;
        line-height: 29px;
      }

      /* Cards */
      .selection-cards {
        display: flex;
        flex-direction: row;
        gap: 24px;
        padding: 32px 0;
        width: 100%;
        justify-content: center;
      }

      .card {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--bg-card);
        border: 2px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 24px;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        border-color: var(--text-muted);
      }

      .card.active {
        border-color: var(--text-primary);
      }

      .card-icon {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-icon);
        border-radius: var(--radius-sm);
        padding: 96px 0;
        overflow: hidden;
      }

      .card-icon svg {
        flex-shrink: 0;
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
      }

      .card-title {
        margin: 0;
        color: var(--text-primary);
        font-size: 20px;
        font-weight: 700;
        line-height: 25px;
      }

      .card-desc {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 20px;
      }

      .card-footer {
        display: flex;
        justify-content: flex-end;
        padding-top: 16px;
        width: 100%;
        margin-top: auto;
      }

      .radio {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--border-radio);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .radio-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--text-primary);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .card.active .radio-dot {
        opacity: 1;
      }

      /* Footer action */
      .footer-margin {
        padding-top: 32px;
        width: 100%;
      }

      .footer-action {
        width: 100%;
        border-top: 1px solid var(--border-light);
        padding: 48px 0 80px;
        display: flex;
        justify-content: flex-end;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--text-primary);
        color: #ffffff;
        font-family: var(--font-family);
        font-size: 16px;
        font-weight: 700;
        line-height: 24px;
        padding: 12px 32px;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .btn-primary:hover {
        background: #1e293b;
      }

      .btn-primary svg {
        flex-shrink: 0;
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .wizard-content {
          padding: 40px 80px;
        }
      }

      @media (max-width: 768px) {
        .wizard-content {
          padding: 24px 20px;
        }

        .heading h1 {
          font-size: 28px;
          line-height: 36px;
          letter-spacing: -0.7px;
        }

        .subtitle {
          font-size: 16px;
          line-height: 26px;
        }

        .selection-cards {
          flex-direction: column;
          gap: 16px;
        }

        .card {
          flex: 1 1 auto;
        }

        .card-icon {
          padding: 48px 0;
        }

        .progress-header {
          align-items: flex-start;
          gap: 12px;
        }

        .progress-percent {
          height: auto;
        }
      }
    </style>
  </head>

    </main>

    <script>
      const cards = document.querySelectorAll('.card');

      cards.forEach((card) => {
        card.addEventListener('click', () => {
          cards.forEach((c) => {
            c.classList.remove('active');
            c.setAttribute('aria-checked', 'false');
          });
          card.classList.add('active');
          card.setAttribute('aria-checked', 'true');
        });

        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });
      });
    </script>
